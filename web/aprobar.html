<script>try{var p=localStorage.getItem('paleta')||(localStorage.getItem('tema')==='claro'?'dia':'');if(p==='dia')document.documentElement.setAttribute('data-tema','claro');}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<main id="ap" class="ap" aria-live="polite">
