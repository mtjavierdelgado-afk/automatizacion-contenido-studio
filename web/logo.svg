<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="CrearIA Studio">
  <!-- CrearIA Studio: la C de Crear con el bucle (infinito) dentro y un «play»
       en su lazo derecho. Variante «Equilibrada» (19-10-2026). Es el mismo
       dibujo que la cabecera de index.html.

       EL COLOR DEL PLAY LO ESTA DECIDIENDO EL DUEÑO: se cambia SOLO en
       --logo-play, aqui abajo (y en el :root de estilo.css para la cabecera).
       P1 (por defecto): url(#gv), el degradado de la C. P2: #C4B5FD (lila).
       P3: #FBBF24 (ambar). P4: #5EEAD4 (turquesa). -->
  <style>
    svg { --logo-c1: #A78BFA; --logo-c2: #7C3AED; --logo-bucle: #FF6B57; --logo-play: url(#gv); }
    .c1 { stop-color: var(--logo-c1); }
    .c2 { stop-color: var(--logo-c2); }
    .c { fill: none; stroke: url(#gv); stroke-width: 5.5; stroke-linecap: round; }
    .bucle { fill: none; stroke: var(--logo-bucle); stroke-width: 5; stroke-linejoin: round; }
    .play { fill: var(--logo-play); stroke: var(--logo-play); stroke-width: .6; stroke-linejoin: round; }
  </style>
  <defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="c1"/><stop offset="1" class="c2"/></linearGradient></defs>
  <path class="c" d="M38.17 12.11A18.5 18.5 0 1 0 38.17 35.89"/>
  <path class="bucle" d="M24 24c-4.5-6-8-9-12-9a9 9 0 0 0 0 18c4 0 7.5-3 12-9s8-9 12-9a9 9 0 0 1 0 18c-4 0-7.5-3-12-9z" transform="translate(24.3 24) scale(0.56) translate(-24 -24)"/>
  <path class="play" d="M29.15 21.38L33.60 24L29.15 26.62z"/>
</svg>
