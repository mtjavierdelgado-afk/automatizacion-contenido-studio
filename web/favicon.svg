<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="32" height="32">
  <!-- El favicon: el logo (logo.svg) simplificado para 16 px. Trazos mas
       gruesos y el «play» un poco mayor, para que la C y el bucle se sigan
       leyendo en la pestaña. El play, con el degradado de la C, como en logo.svg. -->
  <style>
    svg { --logo-c1: #A78BFA; --logo-c2: #7C3AED; --logo-bucle: #FF6B57; --logo-play: url(#gv); }
    .c1 { stop-color: var(--logo-c1); }
    .c2 { stop-color: var(--logo-c2); }
    .c { fill: none; stroke: url(#gv); stroke-width: 7; stroke-linecap: round; }
    .bucle { fill: none; stroke: var(--logo-bucle); stroke-width: 6.5; stroke-linejoin: round; }
    .play { fill: var(--logo-play); stroke: var(--logo-play); stroke-width: 1; stroke-linejoin: round; }
  </style>
  <defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="c1"/><stop offset="1" class="c2"/></linearGradient></defs>
  <path class="c" d="M38.6 11.4A19.5 19.5 0 1 0 38.6 36.6"/>
  <path class="bucle" d="M24 24c-4.5-6-8-9-12-9a9 9 0 0 0 0 18c4 0 7.5-3 12-9s8-9 12-9a9 9 0 0 1 0 18c-4 0-7.5-3-12-9z" transform="translate(24.3 24) scale(0.56) translate(-24 -24)"/>
  <path class="play" d="M28.8 20.8L34.2 24L28.8 27.2z"/>
</svg>
